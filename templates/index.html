<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiGuard | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dashboard-body">

    <!-- Full Screen Map -->
    <div class="fullscreen-map">
        {% if map_html %}
            {{ map_html | safe }}
        {% else %}
            <div class="h-100 d-flex align-items-center justify-content-center text-white landing-bg">
                <h4>No map data available. Please generate the data pipeline and run the solver.</h4>
            </div>
        {% endif %}
    </div>

    <!-- Floating UI Panel (Top Left) -->
    <div class="floating-panel glass-dark shadow-lg">
        <a href="/" class="text-decoration-none mb-3 d-block text-white">← Back to Home</a>
        
        <h5 class="text-white mb-3 fw-bold">Deployment Filters</h5>
        
        <form method="POST" action="/dashboard" id="optForm">
            <label for="budget" class="form-label text-light">Total Police Force: <span id="budgetValue" class="text-accent fw-bold">{{ budget }}</span></label>
            <input type="range" class="form-range custom-slider mb-4" id="budget" name="budget" min="10" max="150" value="{{ budget }}" oninput="document.getElementById('budgetValue').innerText = this.value">
            
            <button type="submit" class="btn btn-glow w-100 mb-3" id="runBtn">Run Optimization</button>
        </form>

        <div class="status-box mt-2">
            <h6 class="text-light mb-1">Solver Status: 
                <span class="badge {% if status == 'Optimal' %}bg-success{% else %}bg-danger{% endif %} ms-1">
                    {{ status }}
                </span>
            </h6>
        </div>
    </div>

</body>
</html>
